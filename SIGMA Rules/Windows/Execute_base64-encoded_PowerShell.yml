title: PowerShell Encoded Command
id: 7c9d3e8a-5f21-4b7d-9c31-2a6e8f4d1b90
status: experimental
description: Detects PowerShell execution using an encoded command.
author: Saeed Elfiky
date: 2026-09-18
logsource:
    category: process_creation
    product: windows

detection:
    selection:
        process.executable|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        process.command_line|contains:
            - ' -EncodedCommand '
            - ' -EncodedCommand='
            - ' -enc '
            - ' -enc='
            - ' -e '
            - ' -e='
    condition: selection

falsepositives:
    - Legitimate administrative scripts using encoded PowerShell commands
    - Software deployment tools

level: high

tags:
    - attack.execution
    - attack.t1059.001